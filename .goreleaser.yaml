version: 2

project_name: external-dns-dnsmasq-webhook

before:
  hooks:
    - go mod tidy
    - sh ./packaging/prepare.sh

builds:
  - id: external-dns-dnsmasq-webhook
    main: .
    binary: external-dns-dnsmasq-webhook
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - id: binaries
    ids:
      - external-dns-dnsmasq-webhook
    formats:
      - tar.gz
    files:
      - README.md
      - deploy/external-dns-dnsmasq-webhook.default
      - deploy/90-kubernetes-external-dns.conf
      - deploy/external-dns-dnsmasq-webhook.service

nfpms:
  - id: linux-packages
    ids:
      - external-dns-dnsmasq-webhook
    package_name: external-dns-dnsmasq-webhook
    release: 1
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Brandon Bennett
    homepage: https://github.com/nemith/external-dns-dnsmasq-webhook
    maintainer: Brandon Bennett <brandon@brbe.me>
    description: |-
      ExternalDNS webhook provider for dnsmasq
      The provider accepts records from ExternalDNS, validates them, and writes
      a dedicated dnsmasq configuration file atomically. Failed validation or
      service restarts restore the previous configuration and provider state.
    license: Proprietary
    section: net
    priority: optional
    bindir: /usr/sbin
    formats:
      - deb
      - rpm
    changelog: packaging/changelog.yaml
    mtime: "{{ .CommitDate }}"
    deb:
      lintian_overrides:
        - statically-linked-binary
        # This private package has no Debian bug tracker entry to close.
        - initial-upload-closes-no-bugs
        # GoReleaser maps its explicit GOAMD64=v1 target to nFPM's optional
        # Architecture-Variant field, which Debian Bookworm's Lintian predates.
        - unknown-field
    contents:
      - src: deploy/90-kubernetes-external-dns.conf
        dst: /etc/dnsmasq.d/90-kubernetes-external-dns.conf
        type: config|noreplace
        file_info:
          mode: 0o644
      - src: deploy/external-dns-dnsmasq-webhook.service
        dst: /usr/lib/systemd/system/external-dns-dnsmasq-webhook.service
        file_info:
          mode: 0o644
      - src: packaging/.generated/external-dns-dnsmasq-webhook.8.gz
        dst: /usr/share/man/man8/external-dns-dnsmasq-webhook.8.gz
        packager: deb
        file_info:
          mode: 0o644
      - src: packaging/.generated/external-dns-dnsmasq-webhook.8.gz
        dst: /usr/share/man/man8/external-dns-dnsmasq-webhook.8.gz
        type: doc
        packager: rpm
        file_info:
          mode: 0o644
      - src: deploy/external-dns-dnsmasq-webhook.default
        dst: /etc/default/external-dns-dnsmasq-webhook
        type: config
        packager: deb
        file_info:
          mode: 0o644
      - src: packaging/copyright
        dst: /usr/share/doc/external-dns-dnsmasq-webhook/copyright
        packager: deb
        file_info:
          mode: 0o644
      - src: deploy/external-dns-dnsmasq-webhook.default
        dst: /etc/sysconfig/external-dns-dnsmasq-webhook
        type: config|noreplace
        packager: rpm
        file_info:
          mode: 0o644
      - src: packaging/copyright
        dst: /usr/share/licenses/external-dns-dnsmasq-webhook/copyright
        type: license
        packager: rpm
        file_info:
          mode: 0o644
      - src: README.md
        dst: /usr/share/doc/external-dns-dnsmasq-webhook/README.md
        type: doc
        packager: rpm
        file_info:
          mode: 0o644
    overrides:
      deb:
        dependencies:
          - dnsmasq (>= 2.86)
          - systemd
        scripts:
          preinstall: packaging/deb/preinstall
          postinstall: packaging/deb/postinstall
          preremove: packaging/deb/preremove
          postremove: packaging/deb/postremove
        deb:
          compression: xz
      rpm:
        dependencies:
          - dnsmasq >= 2.86
          - systemd
        scripts:
          preinstall: packaging/rpm/preinstall
          postinstall: packaging/rpm/postinstall
          preremove: packaging/rpm/preremove
          postremove: packaging/rpm/postremove
        rpm:
          summary: ExternalDNS webhook provider for dnsmasq

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
